<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="%VITE_EVERVAULT_JS_URL%" async onload="init()"></script>
    <script>
      function init() {
        // The script is async, so onload can fire before <body> is parsed.
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init, { once: true });
          return;
        }

        const evervault = new Evervault(
          "%VITE_EV_TEAM_UUID%",
          "%VITE_EV_APP_UUID%"
        );
        evervault.ui.mountElements();

        const card = document.querySelector("ev-card");

        card.addEventListener("change", (event) => {
          console.log("change", event.detail);
        });

        console.log("spec", card.spec);
      }
    </script>
  </head>

  <body>
    <h1>Collect Card Details</h1>
    <ev-card autoprogress>
      <ev-card-number placeholder="Card number"></ev-card-number>
      <ev-row>
        <ev-card-expiry-month></ev-card-expiry-month>
        <ev-card-expiry-year></ev-card-expiry-year>
        <ev-card-cvc></ev-card-cvc>
      </ev-row>
      <ev-field
        name="postcode"
        label="Postcode"
        placeholder="SW1A 1AA"
        autocomplete="postal-code"
        autocapitalize="characters"
        pattern="[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2}"
        errormessage="Enter a UK postcode"
        required
      ></ev-field>
      <ev-field
        name="email"
        type="email"
        label="Email"
        placeholder="jane@example.com"
        autocomplete="email"
      ></ev-field>
    </ev-card>
  </body>
</html>
